[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log

[program:xvfb]
command=/usr/bin/Xvfb %(ENV_DISPLAY)s -screen 0 %(ENV_SCREEN_RESOLUTION)s -nolisten tcp
autorestart=true
priority=1
stdout_logfile=/var/log/supervisor/xvfb.log
stderr_logfile=/var/log/supervisor/xvfb.log

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY="%(ENV_DISPLAY)s"
autorestart=true
priority=2
stdout_logfile=/var/log/supervisor/fluxbox.log
stderr_logfile=/var/log/supervisor/fluxbox.log

[program:x11vnc]
command=/usr/bin/x11vnc -display %(ENV_DISPLAY)s -forever -shared -nopw -rfbport 5900 -quiet
autorestart=true
priority=3
stdout_logfile=/var/log/supervisor/x11vnc.log
stderr_logfile=/var/log/supervisor/x11vnc.log

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
priority=4
stdout_logfile=/var/log/supervisor/novnc.log
stderr_logfile=/var/log/supervisor/novnc.log

[program:browser]
command=/usr/local/bin/start-browser.sh
environment=DISPLAY="%(ENV_DISPLAY)s"
autorestart=true
priority=5
stdout_logfile=/var/log/supervisor/browser.log
stderr_logfile=/var/log/supervisor/browser.log

[program:cdp-proxy]
command=/usr/local/bin/start-nginx.sh
environment=CDP_HOST_PORT="%(ENV_CDP_HOST_PORT)s"
autorestart=true
priority=6
stdout_logfile=/var/log/supervisor/cdp-proxy.log
stderr_logfile=/var/log/supervisor/cdp-proxy.log
